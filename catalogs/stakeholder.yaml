# Metadata about the catalog
metadata:
  title: "Catálogo de Partes Interesadas (Stakeholders)"
  version: "1.1"
  date: "2025-09-25"
  description: "Un catálogo de las categorías de partes interesadas para el Sistema de Información del Transporte Público."
  author:
    - "Jose Murillo Vargas"
    - "Fabián Abarca Calderón"
  organization: "Laboratorio de Sistemas Inteligentes de Movilidad (SIMOVI)"
  contact: "simovi@ucr.ac.cr"
  license: "CC BY 4.0"

# Stakeholder catalog
stakeholders:
  - id: "stakeholder:001"
    name: "Pasajeros"
    description: "Individuos que utilizan el sistema de transporte público para sus traslados diarios o de viaje."
    role: "End Users"
    interests:
      - "Información fiable y puntual sobre llegadas y salidas de autobuses."
      - "Aplicación móvil fácil de usar para la planificación de rutas."
      - "Actualizaciones en tiempo real sobre interrupciones o retrasos del servicio."
    influence: "High"
    priority: "High"
    classifications: # Atributo adicional de ejemplo
      - "Externo"
      - "Usuario final"

  - id: "stakeholder:002"
    name: "Operadores de Autobús"
    description: "Empresas o entidades responsables de operar los autobuses dentro del sistema de transporte público."
    role: "Service Providers"
    interests:
      - "Programación y despacho eficientes de los autobuses."
      - "Acceso a datos en tiempo real para una mejor gestión de la flota."
      - "Integración con sistemas de pago para el cobro de tarifas."
    influence: "High"
    priority: "High"
    classifications:
      - "Externo"
      - "Proveedor"

  - id: "stakeholder:003"
    name: "Autoridades de Transporte de la Ciudad"
    description: "Agencias gubernamentales que supervisan las políticas, regulaciones y financiamiento del transporte público."
    role: "Regulators and Planners"
    interests:
      - "Cumplimiento de las regulaciones y estándares de transporte."
      - "Análisis de datos para la mejora de los servicios de transporte."
      - "Mecanismos de retroalimentación y satisfacción del público."
    influence: "High"
    priority: "Medium"
    classifications:
      - "Interno"
      - "Gobernanza"

  - id: "stakeholder:004"
    name: "Equipos de Mantenimiento"
    description: "Personal responsable del mantenimiento y reparación de los autobuses y la infraestructura relacionada."
    role: "Support Staff"
    interests:
      - "Acceso a horarios y registros de mantenimiento."
      - "Alertas en tiempo real sobre problemas o averías de los vehículos."
      - "Comunicación eficiente con los operadores de autobuses."
    influence: "Medium"
    priority: "Medium"
    classifications:
      - "Interno"
      - "Soporte"