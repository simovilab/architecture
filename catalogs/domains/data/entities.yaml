# =========================
# Metadata about the catalog
# =========================
metadata:
  title: "Data Entity/Component Catalog"
  version: "1.1"
  date: "2025-09-18"
  description: "Reduced catalog of core data entities and components for the Costa Rica Public Transportation Information System, aligned with GTFS."
  author:
    - "Jostin Cubero Torres"
    - "Fabián Abarca Calderón"
  organization: "Laboratorio de Sistemas Inteligentes de Movilidad (SIMOVI)"
  contact: "simovi@ucr.ac.cr"
  license: "CC BY 4.0"

# =================
# Data Entities
# =================
data_entities:

  - id: data-entity:001
    name: "User"
    description: "Registered system user."
    attributes:
      - { id: attribute:001, name: "user_id", type: "String", description: "Unique user identifier." }
      - { id: attribute:002, name: "email", type: "String", description: "Email address." }

  - id: data-entity:002
    name: "Vehicle"
    description: "A physical bus in the fleet."
    attributes:
      - { id: attribute:003, name: "vehicle_id", type: "String", description: "Unique vehicle identifier." }
      - { id: attribute:004, name: "license_plate", type: "String", description: "Bus license plate." }

  - id: data-entity:003
    name: "Driver"
    description: "Driver assigned to a vehicle."
    attributes:
      - { id: attribute:005, name: "driver_id", type: "String", description: "Unique driver identifier." }
      - { id: attribute:006, name: "name", type: "String", description: "Full name." }

  - id: data-entity:004
    name: "Route"
    description: "GTFS route operated by an agency."
    attributes:
      - { id: attribute:007, name: "route_id", type: "String", description: "Unique route identifier." }
      - { id: attribute:008, name: "route_name", type: "String", description: "Descriptive route name." }

  - id: data-entity:005
    name: "Trip"
    description: "Scheduled service for a given route."
    attributes:
      - { id: attribute:009, name: "trip_id", type: "String", description: "Unique trip identifier." }
      - { id: attribute:010, name: "route_id", type: "String", description: "FK -> Route.route_id." }

  - id: data-entity:006
    name: "Stop"
    description: "Location where passengers board or alight."
    attributes:
      - { id: attribute:011, name: "stop_id", type: "String", description: "Unique stop identifier." }
      - { id: attribute:012, name: "name", type: "String", description: "Stop name." }

  - id: data-entity:007
    name: "PaymentTransaction"
    description: "Fare payment record."
    attributes:
      - { id: attribute:013, name: "transaction_id", type: "String", description: "Unique transaction identifier." }
      - { id: attribute:014, name: "amount", type: "Float", description: "Paid amount." }

  - id: data-entity:008
    name: "SystemLog"
    description: "System events for monitoring and debugging."
    attributes:
      - { id: attribute:015, name: "log_id", type: "String", description: "Unique log identifier." }
      - { id: attribute:016, name: "level", type: "String", description: "Log severity (INFO/ERROR)." }

# =================
# Data Components
# =================
data_components:

  - id: data-component:001
    name: "User & Fleet Management"
    description: "Manages users, vehicles, drivers and assignments."
    data_entities: [data-entity:001, data-entity:002, data-entity:003]

  - id: data-component:002
    name: "Relational Database"
    description: "Stores GTFS data and payment transactions."
    data_entities: [data-entity:004, data-entity:005, data-entity:006, data-entity:007]

  - id: data-component:003
    name: "Realtime Engine"
    description: "Processes vehicle positions, trip updates and alerts."
    data_entities: [data-entity:002, data-entity:005]

  - id: data-component:004
    name: "Public & Admin APIs"
    description: "Expose schedules, routes and admin endpoints."
    data_entities: [data-entity:001, data-entity:004, data-entity:005, data-entity:006, data-entity:007, data-entity:008]


