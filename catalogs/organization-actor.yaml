    actorTasks:
      - "Analizar estudios de costos para la fijación de tarifas."
      - "Fiscalizar el cumplimiento de la calidad del servicio."
    contact: "cmora@aresep.go.cr"
    organization: "organization:004"
    roles:
      - "Analyst"

  - id: "actor:006"
    name: "Róger Madrigal López"
    description: "Presidente Ejecutivo actual del Banco Central de Costa Rica (BCCR)."
    type: "Person"
