    actorTasks:
      - "Supervisar la operación de SINPE y SINPE-TP."
      - "Definir las regulaciones para los sistemas de pago."
    contact: "atencionalciudadano@bccr.fi.cr"
    organization: "organization:005"
    roles:
      - "Project Manager"